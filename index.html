<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quadratic Solver</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">

        <!-- Header -->
        <header>
            <div class="logo">∿</div>

            <h1>Quadratic Solver</h1>

            <p>
                Solve <strong>ax² + bx + c = 0</strong> instantly
            </p>
        </header>


        <!-- Main Card -->
        <section class="card">

            <!-- Equation -->
            <div class="equation">
                ax² + bx + c = 0
            </div>


            <!-- Inputs -->
            <div class="inputs">

                <div class="input-group">
                    <label for="a">a</label>

                    <input
                        type="number"
                        id="a"
                        placeholder="Enter a"
                        step="any"
                    >
                </div>


                <div class="operator">x² +</div>


                <div class="input-group">
                    <label for="b">b</label>

                    <input
                        type="number"
                        id="b"
                        placeholder="Enter b"
                        step="any"
                    >
                </div>


                <div class="operator">x +</div>


                <div class="input-group">
                    <label for="c">c</label>

                    <input
                        type="number"
                        id="c"
                        placeholder="Enter c"
                        step="any"
                    >
                </div>

            </div>


            <!-- Buttons -->
            <div class="buttons">

                <button id="solveBtn" class="solve-btn">
                    <span>Calculate</span>
                    <span class="arrow">→</span>
                </button>

                <button id="clearBtn" class="clear-btn">
                    Clear
                </button>

            </div>


            <!-- Error -->
            <div id="error" class="error"></div>


            <!-- Results -->
            <div id="result" class="result">

                <div class="result-header">
                    <span>Results</span>
                    <span id="rootType" class="badge"></span>
                </div>


                <div class="discriminant">
                    <span>Discriminant</span>

                    <strong id="discriminant">
                        —
                    </strong>
                </div>


                <div class="roots">

                    <div class="root-box">
                        <span>x₁</span>
                        <strong id="root1">—</strong>
                    </div>

                    <div class="root-box">
                        <span>x₂</span>
                        <strong id="root2">—</strong>
                    </div>

                </div>


                <button id="copyBtn" class="copy-btn">
                    📋 Copy Results
                </button>

            </div>

        </section>


        <!-- Formula -->
        <section class="formula">

            <h2>Quadratic Formula</h2>

            <div class="formula-equation">
                x =
                <span class="fraction">
                    <span>−b ± √(b² − 4ac)</span>
                    <span>2a</span>
                </span>
            </div>

        </section>


        <footer>
            Built with HTML • CSS • JavaScript
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
