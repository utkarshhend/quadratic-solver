<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Solver</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<main class="container">

    <header>
        <div class="logo">∿</div>
        <h1>Quadratic Solver</h1>
        <p>Solve quadratic equations step by step</p>
    </header>

    <section class="card equation-card">

        <div class="equation">
            <span>a</span>x² + <span>b</span>x + <span>c</span> = 0
        </div>

        <div class="inputs">

            <div class="input-group">
                <label for="a">a</label>
                <input id="a" type="number" step="any" placeholder="1">
            </div>

            <div class="input-group">
                <label for="b">b</label>
                <input id="b" type="number" step="any" placeholder="5">
            </div>

            <div class="input-group">
                <label for="c">c</label>
                <input id="c" type="number" step="any" placeholder="6">
            </div>

        </div>

        <div class="buttons">
            <button class="solve-btn" onclick="solve()">Solve Equation</button>
            <button class="clear-btn" onclick="clearAll()">Clear</button>
        </div>

    </section>


    <section id="result" class="hidden">

        <div class="card result-card">

            <div class="result-header">
                <h2>Solution</h2>
                <button class="copy-btn" onclick="copySolution()">Copy</button>
            </div>

            <div id="rootResult" class="root-result"></div>

        </div>


        <div class="card steps-card">

            <h2>Step-by-Step Solution</h2>

            <div id="steps"></div>

        </div>


        <div class="card graph-card">

            <h2>Parabola Graph</h2>
            <p class="graph-subtitle">Visual representation of the equation</p>

            <canvas id="graph"></canvas>

        </div>

    </section>


    <footer>
        Made with ❤️ using HTML, CSS & JavaScript
    </footer>

</main>

<script src="script.js"></script>

</body>
</html>
